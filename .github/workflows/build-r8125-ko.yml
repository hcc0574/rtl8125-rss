name: build-r8125-rss-ko

# 自包含 workflow：不依赖仓库里的 build-ko.sh / Dockerfile / patches。
# 纯网页用户只需要创建这一个文件，然后在 Actions 页面点 “Run workflow”。
# 不需要任何 secrets；如需国内镜像，可在 Variables 里设 KERNEL_URL / DRV_URL。
on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "目标内核版本（默认 6.18.58，对应 sbwml 25.12.6-standard）"
        required: false
        default: "6.18.58"
      driver_version:
        description: "r8125 驱动版本"
        required: false
        default: "9.018.00"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KVER: ${{ inputs.kernel_version }}
      DRV_VER: ${{ inputs.driver_version }}
      EXPECTED_VERMAGIC: "6.18.58 SMP mod_unload aarch64"
      KERNEL_SHA: "069b19f9032c4dac8149ae4b6520c35debca0f42a9f6d52ee55ba6ca9b818013"
      DRV_SHA: "66291cb5d4d3b359cfa0c9ca902028d9ce0f76065887cb64b4052dce4a676ff8"
      # 可选覆盖（仓库 Settings -> Secrets and variables -> Actions -> Variables）
      KERNEL_URL: ${{ vars.KERNEL_URL }}
      DRV_URL: ${{ vars.DRV_URL }}
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/out
      REF_KO: ${{ github.workspace }}/backup/r8125-9.016.01-original.ko

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            kmod xz-utils bzip2 wget ca-certificates patch \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dwarves python3-pyelftools

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: work/dl
          key: r8125-dl-${{ inputs.kernel_version }}-${{ inputs.driver_version }}
          restore-keys: |
            r8125-dl-

      - name: Build and verify r8125.ko
        run: |
          set -euo pipefail

          KVER="${KVER:-6.18.58}"
          DRV_VER="${DRV_VER:-9.018.00}"
          KERNEL_URL="${KERNEL_URL:-https://cdn.kernel.org/pub/linux/kernel/v6.x}"
          DRV_URL="${DRV_URL:-https://github.com/Karlson2k/r8125/releases/download/$DRV_VER}"
          EXPECTED_VERMAGIC="${EXPECTED_VERMAGIC:-6.18.58 SMP mod_unload aarch64}"
          ARCH=arm64
          CROSS=aarch64-linux-gnu-
          OWRT_COMMIT=350501f839d00bc5429058f30066fe7d8c8f93f1
          OWRT_RAW=https://raw.githubusercontent.com/openwrt/openwrt

          mkdir -p "$WORK/dl" "$WORK/build" "$WORK/patches" "$OUT"

          fetch() {
            url="$1"; dest="$2"
            if [ -s "$dest" ]; then echo "已缓存: $dest"; return 0; fi
            echo "下载: $url"
            wget -c --timeout=60 --tries=3 -O "$dest.part" "$url"
            mv "$dest.part" "$dest"
          }

          echo "==> [1/6] 下载源码并校验 SHA256"
          fetch "$KERNEL_URL/linux-$KVER.tar.xz" "$WORK/dl/linux-$KVER.tar.xz"
          echo "$KERNEL_SHA  $WORK/dl/linux-$KVER.tar.xz" | sha256sum -c -
          fetch "$DRV_URL/r8125-$DRV_VER.tar.bz2" "$WORK/dl/r8125-$DRV_VER.tar.bz2"
          echo "$DRV_SHA  $WORK/dl/r8125-$DRV_VER.tar.bz2" | sha256sum -c -

          echo "==> [2/6] 解包"
          [ -d "$WORK/build/linux-$KVER" ] || tar -xf "$WORK/dl/linux-$KVER.tar.xz" -C "$WORK/build"
          [ -d "$WORK/build/r8125-$DRV_VER" ] || tar -xjf "$WORK/dl/r8125-$DRV_VER.tar.bz2" -C "$WORK/build"
          KSRC="$WORK/build/linux-$KVER"
          DRV="$WORK/build/r8125-$DRV_VER"

          echo "==> [3/6] 生成与固件一致的 .config（vermagic 关键项）"
          fetch "$OWRT_RAW/$OWRT_COMMIT/target/linux/generic/config-6.18" "$WORK/dl/config-generic-6.18"
          fetch "$OWRT_RAW/$OWRT_COMMIT/target/linux/rockchip/armv8/config-6.18" "$WORK/dl/config-rockchip-armv8-6.18"
          cat "$WORK/dl/config-generic-6.18" "$WORK/dl/config-rockchip-armv8-6.18" > "$KSRC/.config"

          cd "$KSRC"
          # 每一项都由固件 kernel 自带的 vmlinux BTF（struct module 63 个成员）反推：
          #   KALLSYMS=y            -> kallsyms/core_kallsyms/sect_attrs/notes_attrs（904..960）
          #   BPF_EVENTS=y          -> num_bpf_raw_events/bpf_raw_events（1024..1040，16 字节）
          #   DEBUG_INFO_BTF_MODULES=y -> btf_data_size..btf_base_data（1040..1064）
          #   JUMP_LABEL=y          -> jump_entries/num_jump_entries（1064）
          #   TRACING=y             -> num_trace_bprintk_fmt/trace_bprintk_fmt_start（1076）
          #   EVENT_TRACING=y       -> trace_events..num_trace_evals（1088..1120）
          #   DYNAMIC_FTRACE=n      -> 固件没有 num_ftrace_callsites/ftrace_callsites（上一版多出的 12 字节）
          #   KPROBES=y             -> kprobes_text_start..num_kprobe_blacklist（1120..1152）
          #   LIVEPATCH/PRINTK_INDEX/KUNIT=n -> 固件 struct module 里没有这三块
          scripts/config --file .config \
            --set-str LOCALVERSION "" \
            --disable LOCALVERSION_AUTO \
            --enable SMP \
            --enable MODULE_UNLOAD \
            --enable SYSFS \
            --enable KALLSYMS \
            --disable MODVERSIONS \
            --disable MODULE_SIG --disable MODULE_SIG_ALL --disable MODULE_SIG_FORCE \
            --disable PREEMPT --disable PREEMPT_VOLUNTARY --disable PREEMPT_DYNAMIC --disable PREEMPT_RT \
            --disable PREEMPT_BUILD --disable PREEMPTION \
            --enable PREEMPT_NONE \
            --enable DEBUG_INFO --disable DEBUG_INFO_REDUCED \
            --enable DEBUG_INFO_BTF --enable DEBUG_INFO_BTF_MODULES \
            --enable BPF_SYSCALL --enable PERF_EVENTS --enable BPF_EVENTS \
            --enable TRACEPOINTS --enable TRACING --enable EVENT_TRACING --enable FTRACE \
            --disable FUNCTION_TRACER --disable FUNCTION_GRAPH_TRACER --disable DYNAMIC_FTRACE \
            --enable JUMP_LABEL --enable KPROBES --enable KPROBE_EVENTS \
            --disable LIVEPATCH --disable PRINTK_INDEX --disable KUNIT \
            --disable STACKTRACE_BUILD_ID \
            --disable LTO_CLANG --disable LTO_CLANG_THIN --disable LTO_CLANG_FULL \
            --disable CFI_CLANG --disable RANDSTRUCT --disable GCC_PLUGIN_RANDSTRUCT \
            2>/dev/null || true
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" olddefconfig >/dev/null

          # olddefconfig 会按依赖关系丢弃不成立的项：在这里先硬校验，避免白跑一次编译。
          chk_on()  { grep -q "^CONFIG_$1=y" .config || { echo "!! CONFIG_$1 没生效（应为 y）"; exit 1; }; }
          chk_off() { if grep -q "^CONFIG_$1=y" .config; then echo "!! CONFIG_$1 没关掉（应为 n）"; exit 1; fi; }
          for c in SMP MODULE_UNLOAD SYSFS KALLSYMS DEBUG_INFO DEBUG_INFO_BTF \
                   DEBUG_INFO_BTF_MODULES BPF_SYSCALL PERF_EVENTS BPF_EVENTS \
                   TRACEPOINTS TRACING EVENT_TRACING JUMP_LABEL KPROBES KPROBE_EVENTS; do
            chk_on "$c"
          done
          for c in DYNAMIC_FTRACE FUNCTION_TRACER FUNCTION_GRAPH_TRACER LIVEPATCH \
                   PRINTK_INDEX KUNIT STACKTRACE_BUILD_ID MODVERSIONS MODULE_SIG; do
            chk_off "$c"
          done

          echo "--- 关键配置 ---"
          grep -E '^CONFIG_(KALLSYMS|BPF_EVENTS|BPF_SYSCALL|PERF_EVENTS|DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|DYNAMIC_FTRACE|FUNCTION_TRACER|FTRACE|TRACING|EVENT_TRACING|TRACEPOINTS|JUMP_LABEL|KPROBES|KPROBE_EVENTS|LIVEPATCH|PRINTK_INDEX|KUNIT|MODULE_UNLOAD|SMP)' .config | sort || true

          echo "==> [4/6] modules_prepare"
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" -j"$(nproc)" modules_prepare
          cat "$KSRC/include/generated/utsrelease.h" || true

          echo "==> [5/6] 内联 DTS 补丁（可选，失败自动回滚）"
          cat > "$WORK/patches/100-add-LED-configuration-from-OF.patch" <<'PATCH100'
          --- a/r8125_n.c
          +++ b/r8125_n.c
          @@ -43,6 +43,7 @@
           #include <linux/etherdevice.h>
           #include <linux/delay.h>
           #include <linux/mii.h>
          +#include <linux/of.h>
           #include <linux/if_vlan.h>
           #include <linux/crc32.h>
           #include <linux/interrupt.h>
          @@ -14680,6 +14681,25 @@ rtl8125_setup_mqs_reg(struct rtl8125_pri
                           tp->imr_reg[i] = (u16)(IMR1_8125 + (i - 1) * 4);
           }
           
          +static int
          +rtl8125_led_configuration(struct rtl8125_private *tp)
          +{
          +        const int led_regs[] = { 0x18, 0x86, 0x84, 0x96 }; /* LEDSEL 0-3 */
          +        u32 led_data[4];
          +        int ret, i;
          +
          +        ret = of_property_read_u32_array(tp->pci_dev->dev.of_node,
          +                                  "realtek,led-data", led_data, 4);
          +
          +        if (ret)
          +                return ret;
          +
          +        for (i = 0; i < 4; i++)
          +                RTL_W16(tp, led_regs[i], led_data[i]);
          +
          +        return 0;
          +}
          +
           static void
           rtl8125_backup_led_select(struct rtl8125_private *tp)
           {
          @@ -15276,6 +15296,8 @@ rtl8125_init_software_variable(struct ne
                   else if (tp->InitRxDescType == RX_DESC_RING_TYPE_4)
                           tp->rtl8125_rx_config &= ~EnableRxDescV4_1;
           
          +        rtl8125_led_configuration(tp);
          +
                   rtl8125_backup_led_select(tp);
           
                   tp->wol_opts = rtl8125_get_hw_wol(tp);
          PATCH100

          cat > "$WORK/patches/110-add-devname-configuration-from-OF.patch" <<'PATCH110'
          --- a/r8125_n.c
          +++ b/r8125_n.c
          @@ -16328,6 +16328,7 @@ rtl8125_init_board(struct pci_dev *pdev,
                   void __iomem *ioaddr;
                   struct net_device *dev;
                   struct rtl8125_private *tp;
          +        const char *devname = of_get_property(pdev->dev.of_node, "label", NULL);
                   int rc = -ENOMEM, i, pm_cap;
           
                   assert(ioaddr_out != NULL);
          @@ -16342,6 +16343,9 @@ rtl8125_init_board(struct pci_dev *pdev,
                           goto err_out;
                   }
           
          +        if (devname)
          +                strscpy(dev->name, devname, IFNAMSIZ);
          +
                   SET_MODULE_OWNER(dev);
                   SET_NETDEV_DEV(dev, &pdev->dev);
                   tp = netdev_priv(dev);
          PATCH110

          cd "$DRV/src"
          for p in "$WORK"/patches/*.patch; do
            echo "尝试补丁: $(basename "$p")"
            if patch -p1 -b -N --fuzz=2 < "$p"; then
              echo "  已应用"
            else
              echo "  [警告] 补丁不适用，已回滚（不影响模块加载，仅影响 LED/接口命名）"
              rm -f ./*.rej
              [ -f r8125_n.c.orig ] && cp -f r8125_n.c.orig r8125_n.c || true
            fi
          done

          echo "==> [6/6] 编译 + 强制校验 vermagic"
          make -C "$DRV/src" \
            KERNELDIR="$KSRC" ARCH="$ARCH" CROSS_COMPILE="$CROSS" \
            CONFIG_ASPM=n ENABLE_RSS_SUPPORT=y ENABLE_MULTIPLE_TX_QUEUE=y \
            KBUILD_MODPOST_WARN=1 modules

          KO="$DRV/src/r8125.ko"
          [ -f "$KO" ] || { echo "编译失败：未生成 r8125.ko"; exit 1; }
          cp -f "$KO" "$OUT/r8125.ko"

          echo "--- modinfo ---"
          modinfo "$OUT/r8125.ko" || true
          GOT="$(modinfo -F vermagic "$OUT/r8125.ko" 2>/dev/null | head -n1 || true)"
          if [ -z "$GOT" ]; then
            GOT="$(strings "$OUT/r8125.ko" | sed -n 's/^vermagic=//p' | head -n1)"
          fi
          echo "vermagic:  $GOT"
          echo "expect:    $EXPECTED_VERMAGIC"
          if [ "$GOT" != "$EXPECTED_VERMAGIC" ]; then
            echo "!! vermagic 不匹配，禁止刷入设备 !!（目标固件内核不是 $KVER）"
            exit 2
          fi

          # ABI 闸门：以固件 kernel 镜像里自带的 vmlinux BTF 为准（struct module = 63 个成员）。
          # 固件原厂 r8125：size=1216 init=312 exit=1184；上一版产物 size 也是 1216（64 字节对齐
          # 把差异抹平了），但 exit=1176，多出 DYNAMIC_FTRACE 的 12 字节、少了 BPF_EVENTS 的 16 字节。
          # 所以这里不只比三个数，还把 63 个成员偏移逐项比对；任一不符 exit 3，不产 artifact。
          echo "==> [6/6] ABI 闸门（ELF 三元组 + BTF 是否生成 + DWARF 逐字段）"
          python3 - "$OUT/r8125.ko" <<'PY'
          import struct, sys

          EXP_SIZE, EXP_INIT, EXP_EXIT = 1216, 312, 1184
          # 来自固件镜像内 vmlinux BTF 的 struct module（bit offset 已换算成字节）。
          EXPECT = {
              'state': 0, 'list': 8, 'name': 24, 'mkobj': 80,
              'modinfo_attrs': 176, 'version': 184, 'srcversion': 192, 'holders_dir': 200,
              'syms': 208, 'crcs': 216, 'num_syms': 224, 'param_lock': 232,
              'kp': 264, 'num_kp': 272, 'num_gpl_syms': 276, 'gpl_syms': 280,
              'gpl_crcs': 288, 'using_gplonly_symbols': 296, 'async_probe_requested': 297,
              'num_exentries': 300, 'extable': 304, 'init': 312, 'mem': 320,
              'arch': 824, 'taints': 864, 'num_bugs': 872, 'bug_list': 880,
              'bug_table': 896, 'kallsyms': 904, 'core_kallsyms': 912, 'sect_attrs': 944,
              'notes_attrs': 952, 'args': 960, 'percpu': 968, 'percpu_size': 976,
              'noinstr_text_start': 984, 'noinstr_text_size': 992, 'num_tracepoints': 996,
              'tracepoints_ptrs': 1000, 'num_srcu_structs': 1008, 'srcu_struct_ptrs': 1016,
              'num_bpf_raw_events': 1024, 'bpf_raw_events': 1032,
              'btf_data_size': 1040, 'btf_base_data_size': 1044,
              'btf_data': 1048, 'btf_base_data': 1056,
              'jump_entries': 1064, 'num_jump_entries': 1072,
              'num_trace_bprintk_fmt': 1076, 'trace_bprintk_fmt_start': 1080,
              'trace_events': 1088, 'num_trace_events': 1096,
              'trace_evals': 1104, 'num_trace_evals': 1112,
              'kprobes_text_start': 1120, 'kprobes_text_size': 1128,
              'kprobe_blacklist': 1136, 'num_kprobe_blacklist': 1144,
              'source_list': 1152, 'target_list': 1168, 'exit': 1184, 'refcnt': 1192,
          }

          def fail(msg):
              print('!! ' + msg)

          ko = sys.argv[1]
          x = open(ko, 'rb').read()

          shoff = struct.unpack_from('<Q', x, 0x28)[0]
          es = struct.unpack_from('<H', x, 0x3A)[0]
          n = struct.unpack_from('<H', x, 0x3C)[0]
          si = struct.unpack_from('<H', x, 0x3E)[0]
          raw = []
          for i in range(n):
              o = shoff + i * es
              raw.append((struct.unpack_from('<I', x, o)[0],
                          struct.unpack_from('<Q', x, o + 24)[0],
                          struct.unpack_from('<Q', x, o + 32)[0]))
          base = raw[si][1]
          sec = {}
          for no, off, sz in raw:
              sec[x[base + no:x.index(b'\0', base + no)].decode()] = (off, sz)

          tm = sec.get('.gnu.linkonce.this_module')
          rela = sec.get('.rela.gnu.linkonce.this_module')
          btf = sec.get('.BTF')
          size = tm[1] if tm else 0
          offs = []
          if rela:
              offs = sorted(struct.unpack_from('<Q', x, rela[0] + i * 24)[0]
                            for i in range(rela[1] // 24))
          init = offs[0] if offs else 0
          exitoff = offs[1] if len(offs) > 1 else 0

          print('struct module: size=%d init=%d exit=%d（期望 %d/%d/%d）'
                % (size, init, exitoff, EXP_SIZE, EXP_INIT, EXP_EXIT))
          # 注意：这里只要求 .config 里 BTF=y、struct module 里有 btf_data 字段；
          # 不要求 .ko 自带 .BTF —— 只做 modules_prepare 时没有 vmlinux，pahole 会打印
          # "Skipping BTF generation ... due to unavailability of vmlinux"，模块 .BTF 不会生成。
          # 模块自己的 .BTF 与 ABI 无关（固件原厂模块有 .BTF，是因为它随整机 vmlinux 一起构建）。
          print('.BTF: %s（仅供参考；缺失不影响 ABI）'
                % ('%d 字节' % btf[1] if btf else '缺失（无 vmlinux，pahole 跳过）'))

          bad = 0
          if size != EXP_SIZE:
              fail('size %d != %d' % (size, EXP_SIZE)); bad += 1
          if init != EXP_INIT:
              fail('init 偏移 %d != %d' % (init, EXP_INIT)); bad += 1
          if exitoff != EXP_EXIT:
              fail('exit 偏移 %d != %d' % (exitoff, EXP_EXIT)); bad += 1

          try:
              from elftools.elf.elffile import ELFFile
          except ImportError:
              fail('缺少 python3-pyelftools，无法做字段级比对'); bad += 1
              print('!! ABI 闸门未通过（%d 项），禁止刷入设备' % bad)
              sys.exit(3)

          got = {}
          try:
              with open(ko, 'rb') as f:
                  dw = ELFFile(f).get_dwarf_info()
                  for cu in dw.iter_CUs():
                      for die in cu.iter_DIEs():
                          if die.tag != 'DW_TAG_structure_type':
                              continue
                          nm = die.attributes.get('DW_AT_name')
                          bs = die.attributes.get('DW_AT_byte_size')
                          if not nm or nm.value != b'module' or not bs or bs.value != EXP_SIZE:
                              continue
                          m = {}
                          for ch in die.iter_children():
                              if ch.tag != 'DW_TAG_member':
                                  continue
                              mn = ch.attributes.get('DW_AT_name')
                              lo = ch.attributes.get('DW_AT_data_member_location')
                              if mn and lo:
                                  m[mn.value.decode('utf-8', 'replace')] = lo.value
                          if len(m) > len(got):
                              got = m
                      if len(got) >= 60:
                          break
          except Exception as exc:  # DWARF 损坏/缺 .debug_info
              fail('读 DWARF 失败：%s（DEBUG_INFO 是否生效？）' % exc); bad += 1

          if not got:
              fail('DWARF 里找不到 struct module（DEBUG_INFO 没生效或模块被 strip）'); bad += 1
          else:
              print('DWARF struct module: %d 个成员（期望 %d 个）' % (len(got), len(EXPECT)))
              for k, v in EXPECT.items():
                  if k not in got:
                      fail('缺少成员 %-24s（期望偏移 %d）' % (k, v)); bad += 1
                  elif got[k] != v:
                      fail('成员偏移 %-24s 实际 %d != 期望 %d' % (k, got[k], v)); bad += 1
              for k, v in got.items():
                  if k not in EXPECT:
                      fail('多出成员 %-24s（偏移 %d）' % (k, v)); bad += 1

          if bad:
              print('!! ABI 闸门未通过（%d 项）；MODVERSIONS 关闭时内核不会拦，'
                    '偏移错会导致 rmmod 不执行 cleanup / refcnt 错位' % bad)
              print('!! 禁止刷入设备；请按固件 vmlinux BTF 重新对齐内核配置')
              sys.exit(3)
          print('ABI OK：size/init/exit + %d 个成员偏移全部与固件 vmlinux BTF 一致' % len(EXPECT))
          PY

          echo "depends: $(modinfo -F depends "$OUT/r8125.ko" 2>/dev/null || echo '(未知)')"
          readelf -h "$OUT/r8125.ko" | sed -n 's/^ *Machine:.*/&/p' || true

          if [ -f "$REF_KO" ]; then
            echo "--- 与固件原厂模块比对未定义符号 ---"
            aarch64-linux-gnu-readelf -sW "$OUT/r8125.ko" | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*//' | sort -u > "$WORK/new.und"
            aarch64-linux-gnu-readelf -sW "$REF_KO" | awk '$7=="UND" && $8!="" {print $8}' | sed 's/@.*//' | sort -u > "$WORK/ref.und"
            if [ -s "$WORK/new.und" ] && [ -s "$WORK/ref.und" ]; then
              EXTRA="$(comm -23 "$WORK/new.und" "$WORK/ref.und" || true)"
              if [ -n "$EXTRA" ]; then
                echo "[警告] 新模块额外需要下列内核符号（固件内核可能未导出）:"
                echo "$EXTRA" | sed 's/^/  - /'
                cp -f "$WORK/new.und" "$OUT/undefined-symbols.txt"
                cp -f "$WORK/ref.und" "$OUT/undefined-symbols-original.txt"
              else
                echo "OK：新模块的外部符号是原厂模块的子集"
              fi
            fi
          else
            echo "（仓库里没有 backup/r8125-9.016.01-original.ko，跳过符号比对；不影响出 .ko）"
          fi

          ( cd "$OUT" && sha256sum r8125.ko > r8125.ko.sha256 )
          echo "==> 完成: $OUT/r8125.ko"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8125-${{ inputs.driver_version }}-ko
          path: out/
          if-no-files-found: error
          retention-days: 30
